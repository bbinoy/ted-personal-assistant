name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg # the voice tests encode audio
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:unused
      - run: npm test
      - run: npm audit --audit-level=high
  # The messenger and signal packages on their own: nothing of the app is installed or run. Proves they compile, test and
  # pack by themselves, and that the two tarballs that would be published install together (signal depends on
  # messenger) and contain no secrets.
  signal-package:
    runs-on: ubuntu-latest # no ffmpeg or speech tools needed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci -w packages/messenger -w packages/signal
      - run: npm run typecheck -w packages/messenger -w packages/signal
      - run: npm test -w packages/messenger -w packages/signal
      - run: npm run build -w packages/messenger -w packages/signal
      - name: Pack both, install them together into an empty folder, import every entry point
        run: npm run verify-pack -w packages/signal -- --keep-tarballs "$RUNNER_TEMP/pack"
      - name: Scan the tarball contents for secrets
        run: |
          for t in "$RUNNER_TEMP"/pack/*.tgz; do d="$RUNNER_TEMP/unpacked/$(basename "$t" .tgz)"; mkdir -p "$d"; tar -xzf "$t" -C "$d"; done
          node scripts/check-secrets.ts --dir "$RUNNER_TEMP/unpacked"
